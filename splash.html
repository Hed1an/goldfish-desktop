<style>

  }

    background: linear-gradient(90deg, #b8932e, #f0d47c, #b8932e);
    animation: slide 1.2s ease-in-out infinite;
  }
  @keyframes slide { 0% { transform: translateX(-100%);} 100% { transform: translateX(100%);} }
  .txt { margin-top: 18px; font-size: 13px; color: #9a978f; letter-spacing: .5px; }
