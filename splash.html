<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    background: radial-gradient(1200px 800px at 50% 40%, #14141a 0%, #0b0b0f 60%);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    font-family: system-ui, "Segoe UI", "Microsoft YaHei", sans-serif; color: #e9e6df;
  }
  .logo {
    width: 128px; height: 128px;
    animation: breathe 1.6s ease-in-out infinite;
  }
  @keyframes breathe { 0%,100% { opacity: .85; transform: scale(1);} 50% { opacity: 1; transform: scale(1.06);} }
  .bar {
    margin-top: 28px; width: 220px; height: 4px; border-radius: 2px;
    background: #22222a; overflow: hidden; position: relative;
  }
  .bar::after {
    content: ''; position: absolute; inset: 0; border-radius: 2px;
    background: linear-gradient(90deg, #b8932e, #f0d47c, #b8932e);
    animation: slide 1.2s ease-in-out infinite;
  }
  @keyframes slide { 0% { transform: translateX(-100%);} 100% { transform: translateX(100%);} }
  .txt { margin-top: 18px; font-size: 13px; color: #9a978f; letter-spacing: .5px; }
  .ver { margin-top: 8px; font-size: 11px; color: #555; }
</style>
</head>
<body>
  <img class="logo" src="assets/icon.svg" alt="DeepSeek Harness">
  <div class="bar"></div>
  <div class="txt">正在启动 黑金小鲸鱼 ...</div>
  <div class="ver">黑金小鲸鱼 · 黑金主题</div>
</body>
</html>
